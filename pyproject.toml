[project]
name = "ballroom"
version = "0.1.0"
description = "Multi-agent social network simulation. Beliefs, factions, emergence."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.scripts]
ballroom = "ballroom.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballroom"]

[tool.ruff]
line-length = 100
target-version = "py310"
